name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript · typecheck, tests, lint, build, asset guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # `pnpm install` runs the postinstall hook, which builds packages/* so
      # their dist/ output and type declarations exist for the checks below.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          set +e
          pnpm test 2>&1 | tee "$RUNNER_TEMP/pnpm-test.log"
          status=$?
          if [ "$status" -ne 0 ]; then
            diagnostics=$(tail -n 35 "$RUNNER_TEMP/pnpm-test.log" | tr '\n' '; ' || true)
            echo "::error title=TypeScript test failure::$diagnostics"
          fi
          exit "$status"

      - name: Lint
        run: pnpm lint

      - name: Asset guard
        run: node scripts/check-assets.mjs

      # Pixelify Sans and Silkscreen are self-hosted from pinned @fontsource
      # packages, so this production build does not fetch fonts from Google.
      - name: Production build
        run: pnpm build

  programs:
    name: Anchor programs · format, check, unit tests, integration tests
    runs-on: ubuntu-latest
    env:
      # The anchor and solana macros expand to cfg values this crate does not
      # declare, which produces hundreds of warning lines per build and pushes
      # the actual test output out of the log. The lint is noise here, not a
      # signal about this repository's code.
      RUSTFLAGS: -A unexpected_cfgs
      # solana-program-test turns on env_logger; at the default level every
      # instruction emits dozens of stable_log DEBUG lines.
      RUST_LOG: error
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: cargo fmt
        run: cargo fmt --all -- --check

      # Catches syntax, type and lifetime errors without the Solana BPF
      # toolchain. A real `anchor build` / `anchor test` still has to run
      # before any deployment.
      - name: cargo check
        shell: bash
        run: |
          set -o pipefail
          set +e
          cargo check --all-targets --message-format=short 2>&1 | tee "$RUNNER_TEMP/cargo-check.log"
          status=$?
          if [ "$status" -ne 0 ]; then
            diagnostics=$(grep -F 'error' "$RUNNER_TEMP/cargo-check.log" | head -n 20 | tr '\n' '; ' || true)
            echo "::error title=Cargo check::$diagnostics"
          fi
          exit "$status"

      # Host-side unit tests: Core asset parser, template allowlist, state,
      # roles and the cost formula.
      - name: Unit tests
        run: cargo test --lib -- --nocapture

      # Instruction tests in programs/district/tests/integration/, run inside
      # solana-program-test (D-0012). They cover the security checks, including
      # forged Core assets, front-run initialization and replayed claims, but
      # not emitted events or BPF compute limits: `anchor test` against a
      # validator is still required before deployment.
      - name: Integration tests
        run: cargo test --test integration -- --test-threads=1
