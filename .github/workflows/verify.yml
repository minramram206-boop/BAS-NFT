name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript · typecheck, tests, lint, asset guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # `pnpm install` runs the postinstall hook, which builds packages/* so
      # their dist/ output and type declarations exist for the checks below.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Asset guard
        run: node scripts/check-assets.mjs

      # `pnpm build` is intentionally not part of CI: next/font downloads
      # Silkscreen and Pixelify Sans from fonts.googleapis.com during the
      # production build. Either give the runner egress to fonts.googleapis.com
      # and fonts.gstatic.com, or set NEXT_FONT_GOOGLE_MOCKED_RESPONSES
      # (see .env.example) and add the step back.

  programs:
    name: Anchor programs · check, unit tests, integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      # Catches syntax, type and lifetime errors without the Solana BPF
      # toolchain. A real `anchor build` / `anchor test` still has to run
      # before any deployment.
      - name: cargo check
        run: cargo check --all-targets

      # Host-side unit tests for the Metaplex Core asset parser in
      # programs/district/src/mpl_core.rs, against synthetic account bytes.
      - name: Unit tests
        run: cargo test --lib -- --nocapture

      # Instruction-level tests in programs/district/tests/integration.rs. They
      # run the real program logic inside solana-program-test's simulated bank,
      # so account constraints, PDA derivation, the SPL Token burn CPI and event
      # emission are all exercised. No validator, no BPF build and no Anchor CLI
      # are involved, which is why this runs in the same job as cargo check.
      #
      # This is not a replacement for `anchor build` + `anchor test` against a
      # real validator before deployment; it is the automated regression guard
      # for the security checks in the meantime.
      - name: Integration tests
        run: cargo test --test integration -- --nocapture --test-threads=1
