name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript · typecheck, tests, lint, asset guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # `pnpm install` runs the postinstall hook, which builds packages/* so
      # their dist/ output and type declarations exist for the checks below.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Asset guard
        run: node scripts/check-assets.mjs

      # `pnpm build` is intentionally not part of CI: next/font downloads
      # Silkscreen and Pixelify Sans from fonts.googleapis.com during the
      # production build. Either give the runner egress to fonts.googleapis.com
      # and fonts.gstatic.com, or set NEXT_FONT_GOOGLE_MOCKED_RESPONSES
      # (see .env.example) and add the step back.

  programs:
    name: Anchor programs · cargo check + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      # Catches syntax, type and lifetime errors without the Solana BPF
      # toolchain. A real `anchor build` / `anchor test` still has to run
      # before any deployment.
      - name: cargo check
        run: cargo check --all-targets

      # Runs the host-side unit tests, which cover the Metaplex Core asset
      # parser in programs/district/src/mpl_core.rs. These are plain Rust tests
      # against synthetic account bytes, so they need no validator and no BPF
      # build. They are the only automated proof that the collection
      # membership check reads the right offsets.
      - name: cargo test
        run: cargo test --lib -- --nocapture
