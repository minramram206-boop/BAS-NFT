name: diagnose

# Temporary. `workflow_dispatch` cannot be used because it resolves the
# workflow file from the default branch, and this branch must not be merged or
# pushed anywhere else. So it triggers on push and is deleted again afterwards.
on:
  push:
    branches: [arena/671307ff-bas-nft]

permissions:
  contents: write
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # rust-cache is skipped on purpose: the failure may be in resolution, and
      # a poisoned cache would hide it.
      - name: Collect cargo output
        run: |
          {
            echo '### rustc / cargo'
            rustc --version
            cargo --version
            echo
            echo '### cargo metadata --filter-platform x86_64-unknown-linux-gnu (resolution)'
            cargo metadata --format-version 1 --filter-platform x86_64-unknown-linux-gnu > /tmp/meta.json 2>/tmp/meta.err
            echo "exit=$?"
            head -c 4000 /tmp/meta.err
            python3 - <<'PY'
          import json
          try:
              meta = json.load(open('/tmp/meta.json'))
          except Exception as exc:
              print('could not parse metadata:', exc)
              raise SystemExit(0)
          for pkg in sorted(meta['packages'], key=lambda p: p['name']):
              if any(k in pkg['name'] for k in ('solana-program', 'solana-sdk', 'spl-token', 'anchor-', 'district', 'tokio')):
                  print(f"{pkg['name']} {pkg['version']}")
          PY
            echo
            echo '### cargo check --all-targets'
            cargo check --all-targets 2>&1 | tail -n 120
            echo
            echo '### cargo test --lib (mpl_core unit tests)'
            cargo test --lib 2>&1 | tail -n 120
            echo
            echo '### cargo test --test integration'
            # Drop the anchor/solana `unexpected cfg` macro warnings, which
            # otherwise push the actual test output out of the captured tail.
            # Only the first test matters here: it prints what the simulation
            # returns, which is what the event assertions depend on.
            cargo test --test integration -- --nocapture --test-threads=1 2>&1 \
              | grep -vE 'unexpected .cfg. condition|note: expected values for|note: using a cfg inside|note: this warning originates|help: try referring|^\s*=|^\s*\||^\s*-->|^[0-9]+ \||^warning:|^\s*$' \
              | tail -n 1400
          } > /tmp/diag.txt 2>&1 || true

      - name: Report the output in an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head -c 60000 /tmp/diag.txt > /tmp/diag-trim.txt
          gh issue create \
            --title "DIAGNOSTIC (temporary): cargo output for run ${{ github.run_id }}" \
            --body-file /tmp/diag-trim.txt

      # One push buys exactly one report, then the repository returns to its
      # normal CI so the pull request checks are not misleading while the next
      # fix is being prepared.
      - name: Retire this workflow and restore verify.yml
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/diagnose.yml
          git mv .github/workflows/verify.yml.off .github/workflows/verify.yml
          git commit -q -m "chore(ci): retire the temporary diagnostic workflow, restore verify.yml"
          git push origin HEAD:arena/671307ff-bas-nft
