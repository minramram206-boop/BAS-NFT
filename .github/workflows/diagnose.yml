name: diagnose

# Temporary. `workflow_dispatch` cannot be used because it resolves the
# workflow file from the default branch, and this branch must not be merged or
# pushed anywhere else. So it triggers on push and is deleted again afterwards.
on:
  push:
    branches: [arena/671307ff-bas-nft]

permissions:
  contents: write
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # rust-cache is skipped on purpose: the failure may be in resolution, and
      # a poisoned cache would hide it.
      - name: Collect cargo output
        env:
          # The anchor and solana macros emit cfg values the compiler does not
          # know about; those warnings are hundreds of lines and push the actual
          # test output out of any reasonable tail.
          RUSTFLAGS: -A unexpected_cfgs
          # solana-program-test turns on env_logger, and at the default level
          # every instruction produces dozens of stable_log DEBUG lines that
          # drown the test summary.
          RUST_LOG: error
        run: |
          {
            echo '### cargo test --lib'
            cargo test --lib 2>&1 | tail -n 40
            echo
            echo '### cargo test --test integration'
            cargo test --test integration -- --nocapture --test-threads=1 2>&1 | tail -n 1200
          } > /tmp/diag.txt 2>&1 || true

      - name: Report the output in an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head -c 60000 /tmp/diag.txt > /tmp/diag-trim.txt
          gh issue create \
            --title "DIAGNOSTIC (temporary): cargo output for run ${{ github.run_id }}" \
            --body-file /tmp/diag-trim.txt

      # One push buys exactly one report, then the repository returns to its
      # normal CI so the pull request checks are not misleading while the next
      # fix is being prepared.
      - name: Retire this workflow and restore verify.yml
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/diagnose.yml
          git mv .github/workflows/verify.yml.off .github/workflows/verify.yml
          git commit -q -m "chore(ci): retire the temporary diagnostic workflow, restore verify.yml"
          git push origin HEAD:arena/671307ff-bas-nft
