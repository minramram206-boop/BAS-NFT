[toolchain]
anchor_version = "0.30.1"
solana_version = "1.18.26"

[features]
resolution = true
skip-lint = false

[programs.devnet]
district = "D8HGhXUqHx7UXysCMEBDzvd3FS4XGEMNjCR6Eaj8CRbV"

[programs.mainnet]
district = "D8HGhXUqHx7UXysCMEBDzvd3FS4XGEMNjCR6Eaj8CRbV"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
# Integration tests run against solana-program-test's simulated bank, so they
# need neither a validator nor the Anchor CLI. `anchor test` still works if you
# have the toolchain; it just runs this.
test = "cargo test --manifest-path programs/district/Cargo.toml"

# NOTE
# The program id above is the public half of a generated, NEVER DEPLOYED
# keypair, and it is identical to the one in declare_id! and config/*.json so
# that `cargo check` succeeds. It controls nothing. Before deploying:
#   solana-keygen new -o programs/district/keypair.json   (gitignored)
#   anchor keys sync
# then write the new pubkey into config/devnet.json and config/mainnet.json.
# `pnpm test` fails if the four copies drift apart;
# `findPlaceholderAddresses(DEVNET_CONFIG)` lists every address still to be
# replaced before a launch.
