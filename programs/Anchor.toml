[toolchain]
anchor_version = "0.30.1"
solana_version = "1.18.26"

# This file lives in programs/, so the program sits at ./district rather than
# Anchor's default programs/*.
[workspace]
members = ["district", "market", "prize_vault"]

[features]
resolution = true
skip-lint = false

[programs.devnet]
district = "82zccW1Z97ic24aCrt2c3U6qDUZMfbHufZMCjv2dm1Ym"
# Devnet only until an external audit (docs/MARKET.md).
market = "EVjdJiuyVfKUoQFirJDbCauvkHcVKZ38y9i2XAP1ypyP"
# Season prize vault (docs/PRIZE_VAULT.md). Mainnet gets its own keypair.
prize_vault = "5A2vzRDhfPfzpZrtvmhx6HFLLD2xmdcHStDwzPcNuXUP"

[programs.mainnet]
district = "82zccW1Z97ic24aCrt2c3U6qDUZMfbHufZMCjv2dm1Ym"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
# The instruction tests run in solana-program-test. `pnpm program:test-sbf`
# runs the same tests against the built SBF binary.
test = "cargo test --manifest-path programs/district/Cargo.toml"

# NOTE
# The program id above is the devnet program (D-0027). Its keypair is
# programs/district/keypair.json, which is gitignored and only needed for the
# first `solana program deploy`. Mainnet gets its own keypair before the
# mainnet build; `pnpm test` fails if declare_id!, this file and
# config/*.json drift apart.
